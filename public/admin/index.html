<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postre Admin</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#e0553f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Postre">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #1a1d21; --muted: #6b7280;
    --brand: #e0553f; --brand-dark: #c9442f; --ok: #16a34a; --warn: #d97706;
    --bad: #dc2626; --info: #2563eb; --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 10px; width: 100%; background: #fff; }
  input:focus, select:focus { outline: 2px solid var(--brand); border-color: transparent; }

  /* ---------- login ---------- */
  #login-view { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { background: var(--card); border-radius: var(--radius); box-shadow: 0 10px 40px rgba(0,0,0,.08); padding: 40px; width: 360px; max-width: 92vw; }
  .login-card h1 { font-size: 22px; margin-bottom: 4px; }
  .login-card p { color: var(--muted); margin-bottom: 24px; font-size: 14px; }
  .brand-dot { color: var(--brand); }

  /* ---------- layout ---------- */
  #app { display: none; }
  header.topbar { background: var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.06); position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; }
  header.topbar .logo { font-weight: 700; font-size: 17px; }
  header.topbar .user { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
  .layout { display: flex; max-width: 1200px; margin: 0 auto; }
  nav.sidebar { width: 200px; padding: 20px 12px; }
  nav.sidebar a { display: block; padding: 11px 14px; border-radius: 10px; color: var(--ink); text-decoration: none; margin-bottom: 4px; font-size: 15px; }
  nav.sidebar a.active { background: var(--brand); color: #fff; font-weight: 600; }
  main.content { flex: 1; padding: 24px 20px 80px; min-width: 0; }

  /* bottom nav on mobile — horizontally scrollable, no "More" sheet needed */
  nav.bottombar { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
    box-shadow: 0 -2px 10px rgba(0,0,0,.08); z-index: 20; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; }
  nav.bottombar::-webkit-scrollbar { display: none; }
  nav.bottombar a { flex: 1 0 64px; text-align: center; padding: 10px 6px; font-size: 11px; color: var(--muted); text-decoration: none; white-space: nowrap; }
  nav.bottombar a.active { color: var(--brand); font-weight: 700; }
  nav.bottombar a span { display: block; font-size: 18px; }
  @media (max-width: 760px) {
    nav.sidebar { display: none; }
    nav.bottombar { display: flex; }
    main.content { padding: 16px 14px 90px; }
  }

  /* ---------- settings tabs ---------- */
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 2px solid #e5e7eb; }
  .tab-btn { border: none; background: transparent; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tab-btn.active { color: var(--brand); border-bottom-color: var(--brand); }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* ---------- components ---xx---------- */
  h2.page-title { margin-bottom: 18px; font-size: 22px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  .stat .num { font-size: 26px; font-weight: 700; margin-top: 4px; }
  .stat .lbl { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.05); margin-bottom: 16px; }
  .card h3 { font-size: 15px; margin-bottom: 12px; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; }
  .b-PENDING { background: #fef3c7; color: var(--warn); }
  .b-CONFIRMED { background: #dbeafe; color: var(--info); }
  .b-PREPARING { background: #ede9fe; color: #7c3aed; }
  .b-READY { background: #d1fae5; color: var(--ok); }
  .b-COMPLETED { background: #e5e7eb; color: var(--muted); }
  .b-CANCELLED { background: #fee2e2; color: var(--bad); }
  .b-UNPAID { background: #fee2e2; color: var(--bad); }
  .b-PAID { background: #d1fae5; color: var(--ok); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding: 8px; }
  td { padding: 10px 8px; border-top: 1px solid #f0f1f3; vertical-align: top; }
  tr:hover td { background: #fafbfc; }
  .table-wrap { overflow-x: auto; }

  .btn { border: none; border-radius: 10px; padding: 9px 16px; font-weight: 600; background: var(--brand); color: #fff; }
  .btn:hover { background: var(--brand-dark); }
  .btn.ghost { background: #eef0f2; color: var(--ink); }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  .btn.danger { background: var(--bad); }
  .btn.ok { background: var(--ok); }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ---- row actions: primary button + "⋯" more menu ---- */
  .row-actions.menu { align-items: center; }
  .row-menu-wrap { position: relative; display: inline-block; }
  .row-menu { display: none; position: fixed; z-index: 60; min-width: 170px; background: #fff;
    border: 1px solid #e5e7eb; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 6px; }
  .row-menu.open { display: flex; flex-direction: column; gap: 2px; }
  .row-menu .btn.sm { width: 100%; text-align: left; white-space: nowrap; }
  .row-menu .btn.sm:not(.ok):not(.danger):not(.ghost) { background: var(--brand); color: #fff; }
  .row-menu .btn.ok { background: var(--ok); }
  .row-menu .btn.danger { background: var(--bad); }
  .row-menu .btn.ghost { background: #eef0f2; color: var(--ink); }
  .row-menu .btn.sm:hover { filter: brightness(.94); }
  @media (max-width: 760px) {
    .row-actions.menu { gap: 4px; }
    .row-menu { min-width: 180px; max-width: calc(100vw - 16px); }
  }

  /* button busy/loader state */
  .btn .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.45);
    border-top-color: #fff; border-radius: 50%; margin-right: 6px; vertical-align: -2px;
    animation: btnspin .7s linear infinite; }
  .btn.ghost .spin, .btn[data-style-ghost] .spin { border-color: rgba(0,0,0,.18); border-top-color: var(--ink); }
  .btn.loading { opacity: .75; pointer-events: none; }
  @keyframes btnspin { to { transform: rotate(360deg); } }

  /* modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  .overlay.show { display: flex; animation: overlay-in .2s ease; }
  @keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }
  .modal { background: var(--card); border-radius: var(--radius); padding: 24px; width: 520px; max-width: 96vw; box-shadow: 0 20px 60px rgba(0,0,0,.25); animation: modal-in .25s cubic-bezier(.2,.8,.2,1); }
  @keyframes modal-in { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal h3 { margin-bottom: 16px; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
  .modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .modal-actions .btn { min-width: 90px; }

  /* order editor specific */
  .oe-add-section { background: #f8f9fb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .oe-add-section .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .oe-item-row { transition: all .15s; }
  .oe-item-row:hover { background: #fafbfc; }
  .oe-item-row.oe-removed { opacity: .5; background: #fef2f2; }
  .oe-item-row.oe-removed b { text-decoration: line-through; }
  .oe-line-total { width: 82px; text-align: right; font-weight: 600; font-size: 14px; }
  .oe-item-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: #f0f1f3; flex-shrink: 0; }
  .oe-item-thumb.noimg { display: flex; align-items: center; justify-content: center; color: #9aa1a9; font-size: 16px; }
  .oe-qty-input { width: 50px; text-align: center; padding: 6px; border: 1px solid #d1d5db; border-radius: 8px; }
  .oe-qty-input:focus { outline: 2px solid var(--brand); border-color: transparent; }
  .oe-totals-bar { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 10px 14px; font-weight: 600; color: #166534; margin-top: 10px; }
  .oe-section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }

  /* toast notifications */
  #toast { position: fixed; top: 18px; right: 18px; z-index: 99; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); animation: toast-in .25s cubic-bezier(.2,.8,.2,1); min-width: 200px; max-width: 380px; }
  .toast.err { background: var(--bad); }
  .toast.out { animation: toast-out .2s ease forwards; }
  @keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes toast-out { to { opacity: 0; transform: translateX(20px); } }

  /* improved status badges with icons */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .b-PENDING { background: #fef3c7; color: var(--warn); }
  .b-CONFIRMED { background: #dbeafe; color: var(--info); }
  .b-PREPARING { background: #ede9fe; color: #7c3aed; }
  .b-READY { background: #d1fae5; color: var(--ok); }
  .b-COMPLETED { background: #e5e7eb; color: var(--muted); }
  .b-CANCELLED { background: #fee2e2; color: var(--bad); }
  .b-UNPAID { background: #fee2e2; color: var(--bad); }
  .b-PAID { background: #d1fae5; color: var(--ok); }
  #crop-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 80; display: none;
    align-items: center; justify-content: center; padding: 16px; }
  #crop-overlay.show { display: flex; }
  .crop-box { background: var(--card); border-radius: var(--radius); padding: 18px; width: 420px; max-width: 96vw;
    box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .crop-box h3 { margin-bottom: 12px; font-size: 16px; }
  #crop-stage { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #1a1d21; border-radius: 10px;
    overflow: hidden; touch-action: none; user-select: none; cursor: grab; }
  #crop-stage:active { cursor: grabbing; }
  #crop-img { position: absolute; top: 50%; left: 50%; transform-origin: center; will-change: transform; max-width: none; }
  #crop-mask { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at center, transparent 0, transparent calc(70.7% - 1px), rgba(0,0,0,.55) 70.7%); }
  #crop-mask::after { content: ''; position: absolute; inset: 14.65%; border: 2px solid rgba(255,255,255,.85); border-radius: 12px; }
  .crop-controls { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .crop-controls input[type=range] { flex: 1; padding: 0; border: none; accent-color: var(--brand); }
  .crop-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 13px; }
  .slot-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f1f3; font-size: 14px; }
  img.thumb, span.thumb { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: #f0f1f3; display: inline-block; vertical-align: middle; flex: none; }
  span.thumb.noimg { display: inline-flex; align-items: center; justify-content: center; color: #9aa1a9; font-size: 20px; }

  /* Skeleton shimmer while images fetch — the class is removed once the img loads */
  img.img-skel {
    background: linear-gradient(90deg, #eef0f3 25%, #dde2ea 50%, #eef0f3 75%);
    background-size: 200% 100%;
    animation: img-skel 1.4s infinite;
  }
  @keyframes img-skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
/* ---------- compact order / reservation cards (mobile-first) ---------- */
  .oc-select-head, .rc-select-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
  .oc-select-head input, .rc-select-head input { width: auto; padding: 0; accent-color: var(--brand); }
  .oc-grid, .rc-grid { display: grid; gap: 12px; }
  @media (min-width: 960px) { .oc-grid, .rc-grid { grid-template-columns: 1fr 1fr; } }
  .oc-card, .rc-card { background: var(--card); border: 1px solid #e7e9ec; border-radius: 12px; padding: 12px 14px; }
  .oc-head, .rc-head { display: flex; align-items: center; gap: 8px; }
  .oc-check, .rc-check { display: flex; align-items: center; }
  .oc-check input, .rc-check input { width: auto; padding: 0; accent-color: var(--brand); margin: 0; }
  .oc-title, .rc-title { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .oc-cust, .rc-cust { margin-top: 8px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 5px 14px; color: var(--ink); }
  .oc-line, .rc-line { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .oc-items, .rc-items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .oc-chip { background: #f4f5f7; border: 1px solid #eceef0; border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--ink); display: inline-flex; align-items: center; gap: 5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .oc-foot, .rc-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e5e7eb; flex-wrap: wrap; }
  .oc-total { font-weight: 700; font-size: 15px; color: var(--brand); }
  .oc-sub { font-size: 11.5px; color: var(--muted); }
  .oc-actions, .rc-actions { display: flex; gap: 6px; align-items: center; }
  .oc-empty, .rc-empty { padding: 24px; text-align: center; color: var(--muted); }
  .rc-order { margin-top: 8px; font-size: 12.5px; background: #fafbfc; border: 1px solid #eceef0; border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .rc-order .badge { font-size: 10px; padding: 2px 8px; }
  @media (max-width: 480px) {
    .oc-foot, .rc-foot { flex-direction: column; align-items: stretch; }
    .oc-actions, .rc-actions { justify-content: flex-end; }
  }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-view">
  <div class="login-card">
    <h1>Postre <span class="brand-dot">Admin</span></h1>
    <p>Messenger Ordering &amp; Reservation System</p>
    <form id="login-form">
      <div class="field"><label>Username</label><input id="login-user" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input id="login-pass" type="password" autocomplete="current-password" required></div>
      <button class="btn" style="width:100%" type="submit">Sign in</button>
    </form>
    <p id="login-err" class="muted" style="color:var(--bad);margin-top:10px"></p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header class="topbar">
    <div class="logo">Postre <span class="brand-dot">Admin</span></div>
    <div class="user"><span id="whoami"></span><button class="btn ghost sm" id="logout-btn">Log out</button></div>
  </header>
  <div class="layout">
    <!-- nav links are generated by app.js from the NAV config (single source of truth) -->
    <nav class="sidebar" id="side-nav"></nav>
    <main class="content" id="main"></main>
  </div>
  <nav class="bottombar" id="bottom-nav"></nav>
</div>

<div class="overlay" id="modal-overlay"><div class="modal" id="modal"></div></div>

<!-- ============ IMAGE CROPPER ============ -->
<div id="crop-overlay">
  <div class="crop-box">
    <h3>Crop image</h3>
    <div id="crop-stage">
      <img id="crop-img" alt="">
      <div id="crop-mask"></div>
    </div>
    <div class="crop-controls">
      <span title="Zoom out">➖</span>
      <input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1">
      <span title="Zoom in">➕</span>
    </div>
    <div class="crop-actions">
      <button class="btn ghost" id="crop-cancel">Cancel</button>
      <button class="btn" id="crop-apply">Apply crop</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
<script>
  // Register service worker for PWA installability
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(reg => console.log('[pwa] service worker registered:', reg.scope))
        .catch(err => console.log('[pwa] service worker registration failed:', err));
    });
  }
</script>
</body>
</html>
